{% extends "base.html" %}
{% block title %}Генератор{% endblock %}
{% block content %}
<h2>Генератор паролей</h2>

<form method="POST">
    <div class="form-group">
        <label for="length">Длина пароля:</label>
        <input type="number" id="length" name="length" value="12" min="6" max="64">
    </div>

    <div class="checkbox-group">
        <label><input type="checkbox" name="uppercase" checked> A-Z</label>
        <label><input type="checkbox" name="lowercase" checked> a-z</label>
        <label><input type="checkbox" name="digits" checked> 0-9</label>
        <label><input type="checkbox" name="special" checked> !@#$%^&*_+-=</label>
    </div>

    <button type="submit" class="btn btn-primary">Сгенерировать</button>
</form>

{% if generated_password %}
<div class="password-display" id="pwdDisplay">{{ generated_password }}</div>
<button class="btn btn-info" onclick="copy('{{ generated_password }}')">Копировать</button>
{% endif %}

<script>
function copy(text) {
    const el = document.createElement('textarea');
    el.value = text;
    document.body.appendChild(el);
    el.select();
    document.execCommand('copy');
    document.body.removeChild(el);
    alert('Скопировано!');
}
</script>
{% endblock %}
