<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Password Generator{% endblock %}</title>
    <style>
        body { font-family: sans-serif; background: #f5f7fa; margin: 0; padding: 20px; color: #333; }
        .container { max-width: 600px; margin: 0 auto; background: white; padding: 30px; border-radius: 8px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        h2 { margin-top: 0; text-align: center; }
        .alert { padding: 10px 15px; margin-bottom: 20px; border-radius: 4px; }
        .alert-success { background: #d4edda; color: #155724; border: 1px solid #c3e6cb; }
        .alert-danger { background: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; }
        .alert-warning { background: #fff3cd; color: #856404; border-color: #ffc107; }
        .alert-info { background: #d1ecf1; color: #0c5460; border-color: #17a2b8; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: 500; }
        input[type="text"], input[type="number"], input[type="password"] {
            width: 100%; padding: 10px; box-sizing: border-box; border: 1px solid #ccc; border-radius: 4px; font-size: 14px;
        }
        .checkbox-group { display: flex; flex-wrap: wrap; gap: 15px; margin: 15px 0; }
        .checkbox-group label { display: inline-flex; align-items: center; font-weight: normal; margin: 0; }
        .checkbox-group input { margin-right: 5px; }
        .btn { display: block; width: 100%; padding: 12px; color: white; border: none; border-radius: 4px; font-size: 16px; cursor: pointer; margin-top: 10px; text-align: center; text-decoration: none; }
        .btn { background: #6c757d; }
        .btn-primary { background: #28a745; }
        .btn-danger { background: #dc3545; }
        .btn-info { background: #17a2b8; }
        .password-display { background: #e9ecef; padding: 15px; border-radius: 4px; font-family: monospace; font-size: 20px; text-align: center; margin: 20px 0; word-break: break-all; border: 1px solid #ced4da; }
        footer { text-align: center; margin-top: 30px; padding: 10px; border-top: 1px solid #ddd; color: #666; }
    </style>
</head>
<body>
    <div class="container">
        {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
        {% for category, message in messages %}
        <div class="alert alert-{{ category }}">{{ message }}</div>
        {% endfor %}
        {% endif %}
        {% endwith %}
        {% block content %}{% endblock %}
    </div>
    <footer>© 2025 Генератор паролей</footer>
</body>
</html>
